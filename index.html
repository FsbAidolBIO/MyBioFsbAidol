<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            background: #05070d;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow-x: hidden;
            overflow-y: auto;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transition: background 0.5s ease;
        }
        canvas { position: fixed; top: 0; left: 0; z-index: 0; }
        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 440px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes floatEmoji {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-80px) scale(1.5); opacity: 0; }
        }

        .profile-card {
            width: 100%;
            background: rgba(15, 18, 30, 0.55);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 30px 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5), 0 0 30px rgba(124, 58, 237, 0.25), 0 0 80px rgba(79, 70, 229, 0.15);
            animation: scaleIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.08);
            transition: transform 0.1s ease-out, background 0.5s ease;
        }
        .avatar-wrapper {
            position: relative;
            cursor: pointer;
        }
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: url("https://i.imgur.com/uHKPwGT.jpeg") center/cover;
            border: 2px solid rgba(255,255,255,0.2);
            box-shadow: 0 0 25px #7c3aed, 0 0 50px #4f46e5;
            opacity: 0;
            animation: fadeInUp 0.6s 0.2s forwards;
            transition: transform 0.3s;
        }
        .avatar-wrapper:hover .avatar {
            transform: scale(1.05);
        }
        .floating-emoji {
            position: absolute;
            pointer-events: none;
            animation: floatEmoji 1s forwards;
            font-size: 18px;
        }
        .name {
            margin-top: 12px;
            font-size: 26px;
            font-weight: 600;
            opacity: 0;
            animation: fadeInUp 0.6s 0.35s forwards;
        }
        .bio {
            margin-top: 4px;
            font-size: 13px;
            color: #b0b4c4;
            opacity: 0;
            animation: fadeInUp 0.6s 0.38s forwards;
            line-height: 1.4;
            min-height: 18px;
        }
        .status-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 6px;
            font-size: 13px;
            color: #f59e0b;
            opacity: 0;
            animation: fadeInUp 0.6s 0.45s forwards;
            flex-wrap: wrap;
            justify-content: center;
        }
        .online-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #f59e0b;
            box-shadow: 0 0 8px #f59e0b;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.15); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
        .battery {
            display: flex;
            align-items: center;
            gap: 3px;
            font-size: 11px;
            color: #8b8fa6;
        }
        .battery-icon {
            width: 20px;
            height: 10px;
            border: 1px solid #8b8fa6;
            border-radius: 2px;
            position: relative;
        }
        .battery-fill {
            position: absolute;
            left: 1px;
            top: 1px;
            bottom: 1px;
            background: #22c55e;
            border-radius: 1px;
        }
        .age-badge {
            background: rgba(124, 58, 237, 0.2);
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            color: #c4b5fd;
        }
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-top: 24px;
            width: 100%;
            opacity: 0;
            animation: fadeInUp 0.6s 0.55s forwards;
        }
        .info-tile {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            padding: 14px 6px;
            text-decoration: none;
            color: inherit;
            transition: all 0.25s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            backdrop-filter: blur(8px);
            cursor: pointer;
        }
        .info-tile:hover {
            background: rgba(124, 58, 237, 0.15);
            border-color: rgba(124, 58, 237, 0.35);
            transform: translateY(-2px);
        }
        .tile-label { font-size: 10px; color: #8b8fa6; text-transform: uppercase; }
        .tile-value { font-weight: 500; color: #e2e8f0; font-size: 14px; }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 14px;
            justify-content: center;
            opacity: 0;
            animation: fadeInUp 0.6s 0.6s forwards;
        }
        .tag {
            background: rgba(124, 58, 237, 0.15);
            border: 1px solid rgba(124, 58, 237, 0.25);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            color: #c4b5fd;
            transition: all 0.2s;
            cursor: default;
        }
        .tag:hover {
            background: rgba(124, 58, 237, 0.3);
            transform: scale(1.05);
        }

        .links-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-top: 18px;
            width: 100%;
            opacity: 0;
            animation: fadeInUp 0.6s 0.65s forwards;
        }
        .link-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            padding: 12px 6px;
            color: #c4b5fd;
            text-decoration: none;
            transition: all 0.25s;
            backdrop-filter: blur(8px);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
        }
        .link-btn:hover {
            background: rgba(124, 58, 237, 0.15);
            border-color: rgba(124, 58, 237, 0.35);
            transform: translateY(-2px);
            color: white;
        }
        .link-icon { font-size: 20px; }

        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            color: white;
        }
        .toast.show { opacity: 1; }
        .toast.purple { background: rgba(124, 58, 237, 0.9); }
        .toast.green { background: rgba(34, 197, 94, 0.9); }
        .toast.pink { background: rgba(236, 72, 153, 0.9); }
        .toast.blue { background: rgba(59, 130, 246, 0.9); }

        .theme-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(124, 58, 237, 0.4);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.15);
            color: white;
            font-size: 22px;
            cursor: pointer;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s, transform 0.3s;
        }
        .theme-btn:hover { background: rgba(124, 58, 237, 0.7); transform: scale(1.1); }

        .music-section {
            margin-top: 18px;
            width: 100%;
            opacity: 0;
            animation: fadeInUp 0.6s 0.75s forwards;
        }
        .music-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(17, 24, 39, 0.45);
            backdrop-filter: blur(12px);
            border-radius: 18px;
            padding: 14px 16px;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.08);
            transition: all 0.3s;
        }
        .music-header:hover { background: rgba(124, 58, 237, 0.15); }
        .music-title { font-size: 15px; color: #c4b5fd; font-weight: 500; }
        .arrow { transition: transform 0.3s ease; color: #a78bfa; }
        .music-header.expanded .arrow { transform: rotate(180deg); }
        .music-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.45s ease-in-out;
            background: rgba(17, 24, 39, 0.3);
            border-radius: 0 0 18px 18px;
            margin-top: -2px;
            border: 1px solid rgba(255,255,255,0.04);
            border-top: none;
        }
        .music-content.open { max-height: 1000px; }
        .track-list { padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
        .track {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            border-radius: 16px;
            background: rgba(255,255,255,0.02);
            transition: all 0.3s;
            border: 1px solid transparent;
            flex-wrap: wrap;
        }
        .track.playing {
            background: rgba(124, 58, 237, 0.1);
            border-color: rgba(124, 58, 237, 0.3);
            box-shadow: 0 0 15px rgba(124, 58, 237, 0.1);
        }
        .track-num { width: 20px; font-size: 12px; color: #7f8ea3; }
        .track-info { flex: 1; text-align: left; overflow: hidden; }
        .track-title {
            font-size: 14px;
            font-weight: 500;
            color: #e2e8f0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .track-artist { font-size: 11px; color: #9ca3af; margin-top: 2px; }
        .track-controls { display: flex; gap: 6px; }
        .t-btn {
            padding: 6px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            font-family: inherit;
        }
        .btn-play { background: #7c3aed; color: white; min-width: 65px; }
        .btn-play:hover { background: #8b5cf6; transform: scale(1.05); }
        .btn-link { background: rgba(255,255,255,0.08); color: #c4b5fd; }
        .btn-link:hover { background: rgba(255,255,255,0.15); color: white; }
        .time-display { font-size: 10px; color: #9ca3af; margin-left: 6px; white-space: nowrap; }
        .progress-bar {
            width: 100%;
            height: 3px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            margin-top: 6px;
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .progress-bar.active { opacity: 1; }
        .progress-fill {
            width: 0%;
            height: 100%;
            background: #a78bfa;
            border-radius: 2px;
            transition: width 0.1s linear;
        }
        .eq-bars {
            display: flex;
            gap: 2px;
            align-items: flex-end;
            height: 14px;
            margin-left: 4px;
        }
        .eq-bar {
            width: 3px;
            background: #a78bfa;
            border-radius: 1px;
            animation: eq 0.8s ease-in-out infinite;
        }
        @keyframes eq {
            0%, 100% { height: 30%; }
            50% { height: 100%; }
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            width: 100%;
            flex-wrap: wrap;
            opacity: 0;
            animation: fadeInUp 0.6s 0.85s forwards;
        }
        .btn {
            flex: 1;
            padding: 14px;
            border-radius: 16px;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.25s;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            background: transparent;
        }
        .btn-write { background: rgba(99, 102, 241, 0.3); }
        .btn-write:hover { background: rgba(99, 102, 241, 0.5); transform: translateY(-2px); }
        .btn-share { background: rgba(255,255,255,0.05); color: #c4b5fd; }
        .btn-share:hover { background: rgba(255,255,255,0.12); color: white; transform: translateY(-2px); }
        .btn-random { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
        .btn-random:hover { background: rgba(34, 197, 94, 0.4); transform: translateY(-2px); }

        .easter-egg {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 60px;
            z-index: 999;
            pointer-events: none;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .easter-egg.show { transform: translate(-50%, -50%) scale(1); }
    </style>
</head>
<body>

    <script>
        (function() {
            var canvas = document.getElementById("bg");
            var ctx = canvas.getContext("2d");
            function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
            resize(); window.addEventListener('resize', resize);

            var mouse = { x: -1000, y: -1000 };
            document.addEventListener('mousemove', function(e) {
                mouse.x = e.clientX;
                mouse.y = e.clientY;
            });

            var particles = [];
            for (var i = 0; i < 120; i++) {
                particles.push({
                    x: Math.random() * canvas.width, y: Math.random() * canvas.height,
                    dx: (Math.random() - 0.5) * 2.5, dy: (Math.random() - 0.5) * 2.5,
                    r: Math.random() * 2 + 1.2
                });
            }

            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                for (var a = 0; a < particles.length; a++) {
                    for (var b = a + 1; b < particles.length; b++) {
                        var dx = particles[a].x - particles[b].x;
                        var dy = particles[a].y - particles[b].y;
                        var dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < 85) {
                            ctx.beginPath(); ctx.moveTo(particles[a].x, particles[a].y);
                            ctx.lineTo(particles[b].x, particles[b].y);
                            ctx.strokeStyle = "rgba(255,255,255," + (0.12 - dist/800) + ")";
                            ctx.lineWidth = 0.5; ctx.stroke();
                        }
                    }
                }
                particles.forEach(function(p) {
                    var dx = mouse.x - p.x;
                    var dy = mouse.y - p.y;
                    var distToMouse = Math.sqrt(dx * dx + dy * dy);
                    if (distToMouse < 120) {
                        p.x -= dx * 0.01;
                        p.y -= dy * 0.01;
                    }
                    p.x += p.dx; p.y += p.dy;
                    if (p.x < 0 || p.x > canvas.width) p.dx *= -1;
                    if (p.y < 0 || p.y > canvas.height) p.dy *= -1;
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fillStyle = "rgba(255,255,255,0.8)"; ctx.fill();
                });
                requestAnimationFrame(draw);
            }
            draw();

            // Параллакс
            var profileCard = document.getElementById('profileCard');
            document.addEventListener('mousemove', function(e) {
                var x = (e.clientX / window.innerWidth - 0.5) * 10;
                var y = (e.clientY / window.innerHeight - 0.5) * 10;
                profileCard.style.transform = 'perspective(1000px) rotateY(' + x + 'deg) rotateX(' + (-y) + 'deg) scale(1)';
            });

            // Темы
            var themes = [
                { bg: '#05070d', card: 'rgba(15, 18, 30, 0.55)' },
                { bg: '#0d0510', card: 'rgba(30, 15, 35, 0.55)' },
                { bg: '#100a05', card: 'rgba(35, 20, 15, 0.55)' },
                { bg: '#050d0a', card: 'rgba(15, 30, 25, 0.55)' }
            ];
            var themeIndex = 0;
            document.getElementById('themeBtn').addEventListener('click', function() {
                themeIndex = (themeIndex + 1) % themes.length;
                document.body.style.background = themes[themeIndex].bg;
                profileCard.style.background = themes[themeIndex].card;
                showToast('Тема ' + (themeIndex + 1) + ' / ' + themes.length, 'green');
            });

            // Пасхалка
            var konamiCode = [];
            var secret = [38, 38, 40, 40];
            document.addEventListener('keydown', function(e) {
                konamiCode.push(e.keyCode);
                if (konamiCode.length > secret.length) konamiCode.shift();
                if (konamiCode.join(',') === secret.join(',')) {
                    var egg = document.getElementById('easterEgg');
                    egg.classList.add('show');
                    setTimeout(function() { egg.classList.remove('show'); }, 2000);
                    showToast('🕊️ Пасхалка найдена!', 'pink');
                }
            });

            // Уведомления
            window.showToast = function(msg, color) {
                var toast = document.getElementById('toast');
                toast.textContent = msg;
                toast.className = 'toast ' + (color || 'purple') + ' show';
                clearTimeout(toast._timeout);
                toast._timeout = setTimeout(function() { toast.classList.remove('show'); }, 2000);
            };

            // Копирование
            window.copyText = function(text) {
                navigator.clipboard.writeText(text).then(function() {
                    showToast('📋 Скопировано: ' + text, 'blue');
                });
            };
            window.shareProfile = function() {
                var url = window.location.href;
                navigator.clipboard.writeText(url).then(function() {
                    showToast('🔗 Ссылка на профиль скопирована!', 'green');
                });
            };

            // Часы
            function updateClock() {
                var now = new Date();
                var time = now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
                document.getElementById('clockDisplay').textContent = time;
            }
            updateClock();
            setInterval(updateClock, 10000);

            // Возраст
            function updateAge() {
                var birth = new Date(2011, 11, 19);
                var now = new Date();
                var diff = now - birth;
                var years = Math.floor(diff / (365.25 * 24 * 60 * 60 * 1000));
                var months = Math.floor((diff % (365.25 * 24 * 60 * 60 * 1000)) / (30.44 * 24 * 60 * 60 * 1000));
                document.getElementById('ageBadge').textContent = years + ' л ' + months + ' мес';
            }
            updateAge();

            // Батарея
            if ('getBattery' in navigator) {
                navigator.getBattery().then(function(b) {
                    function updateBattery() {
                        var pct = Math.round(b.level * 100);
                        document.getElementById('batteryFill').style.width = pct + '%';
                        document.getElementById('batteryPercent').textContent = pct + '%';
                    }
                    updateBattery();
                    b.addEventListener('levelchange', updateBattery);
                });
            }

            // Печатная машинка
            var bioText = '🕊️ 14 лет • код, люблю фотографировать горы';
            var bioEl = document.getElementById('bioText');
            var bioIndex = 0;
            function typeBio() {
                if (bioIndex < bioText.length) {
                    bioEl.textContent += bioText.charAt(bioIndex);
                    bioIndex++;
                    setTimeout(typeBio, 40);
                }
            }
            setTimeout(typeBio, 800);

            // Реакции на аватар
            var avatarWrapper = document.getElementById('avatarWrapper');
            var emojis = ['❤️', '🔥', '💜', '✨', '🕊️', '🌟'];
            avatarWrapper.addEventListener('click', function() {
                for (var i = 0; i < 5; i++) {
                    var span = document.createElement('span');
                    span.className = 'floating-emoji';
                    span.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                    span.style.left = (Math.random() * 60 - 10) + 'px';
                    span.style.top = (Math.random() * 40) + 'px';
                    avatarWrapper.appendChild(span);
                    setTimeout(function() { span.remove(); }, 1000);
                }
                showToast('Аватарка кликнута!', 'pink');
            });

            // Треки
            var tracksData = [
                { id: '1', title: 'Ash on My Saddle', artist: 'Dead Bone Music', yt: 'https://www.youtube.com/watch?v=jeiOWmc2Trw' },
                { id: '2', title: '31-я весна', artist: 'Ночные Снайперы', yt: 'https://www.youtube.com/watch?v=OKORZwSEMNE' },
                { id: '3', title: 'Finale', artist: 'Toby Fox', yt: 'https://www.youtube.com/watch?v=5qajT8lS2ok' },
                { id: '4', title: 'Whiskey, Lead & Revenge', artist: 'Dark Country', yt: 'https://www.youtube.com/watch?v=cg3rT28ia4E' },
                { id: '5', title: 'Mary On A Cross (slowed + reverb)', artist: 'Ghost', yt: 'https://www.youtube.com/watch?v=us9plufTqks' },
                { id: '6', title: 'Силуэт (из к/ф «Алиса в Стране...»)', artist: 'Ваня Дмитриенко & Аня Пересильд', yt: 'https://www.youtube.com/watch?v=DRYzImN_bDM' }
            ];

            var trackList = document.getElementById('trackList');
            tracksData.forEach(function(t, index) {
                var div = document.createElement('div');
                div.className = 'track';
                div.setAttribute('data-id', t.id);
                div.innerHTML =
                    '<span class="track-num">' + String(index + 1).padStart(2, '0') + '</span>' +
                    '<div class="track-info">' +
                        '<div class="track-title">' +
                            '<span class="title-text">' + t.title + '</span>' +
                            '<div class="eq-bars" style="display:none"><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div></div>' +
                            '<span class="time-display">0:00 / -:--</span>' +
                        '</div>' +
                        '<div class="track-artist">' + t.artist + '</div>' +
                        '<div class="progress-bar"><div class="progress-fill"></div></div>' +
                    '</div>' +
                    '<div class="track-controls">' +
                        '<button class="t-btn btn-play">Слушать</button>' +
                        '<button class="t-btn btn-link" data-url="' + t.yt + '">🔗</button>' +
                    '</div>';
                trackList.appendChild(div);
            });

            // Плеер
            var audio = document.getElementById('audioPlayer');
            var currentTrackId = null;
            var progressInterval = null;

            function formatTime(sec) {
                if (isNaN(sec)) return '-:--';
                var m = Math.floor(sec / 60);
                var s = Math.floor(sec % 60);
                return m + ':' + String(s).padStart(2, '0');
            }
            function clearPrevious() {
                if (currentTrackId) {
                    var prev = document.querySelector('.track[data-id="' + currentTrackId + '"]');
                    if (prev) {
                        prev.classList.remove('playing');
                        var btn = prev.querySelector('.btn-play');
                        if (btn) btn.textContent = 'Слушать';
                        var eq = prev.querySelector('.eq-bars');
                        if (eq) eq.style.display = 'none';
                        var pb = prev.querySelector('.progress-bar');
                        if (pb) pb.classList.remove('active');
                        var td = prev.querySelector('.time-display');
                        if (td) td.textContent = '0:00 / -:--';
                    }
                }
            }
            function updateProgress() {
                if (!currentTrackId) return;
                var track = document.querySelector('.track[data-id="' + currentTrackId + '"]');
                if (!track) return;
                var fill = track.querySelector('.progress-fill');
                var td = track.querySelector('.time-display');
                if (fill && td && audio.duration) {
                    fill.style.width = (audio.currentTime / audio.duration * 100) + '%';
                    td.textContent = formatTime(audio.currentTime) + ' / ' + formatTime(audio.duration);
                }
            }

            document.querySelectorAll('.track').forEach(function(track) {
                var playBtn = track.querySelector('.btn-play');
                var linkBtn = track.querySelector('.btn-link');
                var trackId = track.getAttribute('data-id');
                var eqBars = track.querySelector('.eq-bars');
                var progressBar = track.querySelector('.progress-bar');

                playBtn.addEventListener('click', function() {
                    var fileUrl = 'track' + trackId + '.mp3';
                    if (currentTrackId === trackId) {
                        if (audio.paused) {
                            audio.play();
                            this.textContent = 'Пауза';
                            track.classList.add('playing');
                            if (eqBars) eqBars.style.display = 'flex';
                            if (progressBar) progressBar.classList.add('active');
                        } else {
                            audio.pause();
                            this.textContent = 'Слушать';
                            track.classList.remove('playing');
                            if (eqBars) eqBars.style.display = 'none';
                        }
                    } else {
                        clearPrevious();
                        audio.src = fileUrl;
                        audio.play();
                        this.textContent = 'Пауза';
                        track.classList.add('playing');
                        if (eqBars) eqBars.style.display = 'flex';
                        if (progressBar) progressBar.classList.add('active');
                        currentTrackId = trackId;
                        if (progressInterval) clearInterval(progressInterval);
                        progressInterval = setInterval(updateProgress, 200);
                    }
                });
                linkBtn.addEventListener('click', function() {
                    window.open(this.getAttribute('data-url'), '_blank');
                });
            });

            audio.onended = function() {
                clearPrevious();
                if (progressInterval) clearInterval(progressInterval);
                currentTrackId = null;
            };
            audio.onerror = function() {
                clearPrevious();
                if (progressInterval) clearInterval(progressInterval);
                currentTrackId = null;
                showToast('Ошибка загрузки трека', 'pink');
            };

            document.getElementById('musicToggle').addEventListener('click', function() {
                this.classList.toggle('expanded');
                document.getElementById('musicContent').classList.toggle('open');
            });

            document.getElementById('randomTrackBtn').addEventListener('click', function() {
                var tracks = document.querySelectorAll('.track');
                var randomIndex = Math.floor(Math.random() * tracks.length);
                var randomTrack = tracks[randomIndex];
                var playBtn = randomTrack.querySelector('.btn-play');
                if (playBtn) playBtn.click();
                showToast('🎲 Случайный трек: ' + tracksData[randomIndex].title, 'blue');
            });
        })();
    </script>
</body>
</html>
