<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FsbAidol • Telegram</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            background: #05070d;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            overflow-y: auto;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.5s ease, color 0.5s ease;
        }
        canvas { position: fixed; top: 0; left: 0; z-index: 0; }
        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 440px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes floatEmoji {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-80px) scale(1.5); opacity: 0; }
        }
        @keyframes rotateBorder {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes breathe {
            0% { box-shadow: 0 0 8px rgba(99, 102, 241, 0.3); }
            50% { box-shadow: 0 0 20px rgba(99, 102, 241, 0.6); }
            100% { box-shadow: 0 0 8px rgba(99, 102, 241, 0.3); }
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .profile-card {
            width: 100%;
            background: rgba(15, 18, 30, 0.55);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 30px 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5), 0 0 30px rgba(124, 58, 237, 0.25), 0 0 80px rgba(79, 70, 229, 0.15);
            animation: scaleIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.08);
            transition: transform 0.1s ease-out, background 0.5s ease, box-shadow 0.5s ease, border-color 0.5s ease;
            position: relative;
            overflow: hidden;
        }
        .profile-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(124,58,237,0.15), rgba(79,70,229,0.1), rgba(236,72,153,0.05), rgba(124,58,237,0.15));
            background-size: 300% 300%;
            animation: gradientShift 8s ease infinite;
            z-index: -1;
            border-radius: 32px;
            transition: background 0.5s ease;
        }
        .compact { padding: 20px 18px; }
        .compact .info-grid { margin-top: 14px; }
        .compact .links-grid { margin-top: 10px; }
        .compact .music-section { margin-top: 10px; }
        .compact .actions { margin-top: 12px; }
        .compact .name { font-size: 22px; }
        .compact .avatar { width: 100px; height: 100px; }
        .compact .mountains-block { height: 40px; margin-top: 5px; margin-bottom: 5px; }

        .scroll-top-btn {
            position: fixed;
            bottom: 140px;
            right: 20px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(124, 58, 237, 0.4);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.15);
            color: white;
            font-size: 22px;
            cursor: pointer;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.4s ease, transform 0.3s ease, background 0.5s ease, color 0.5s ease, border-color 0.5s ease;
            opacity: 0;
            pointer-events: none;
        }
        .scroll-top-btn.visible { opacity: 1; pointer-events: auto; }
        .scroll-top-btn:hover { background: rgba(124, 58, 237, 0.7); transform: scale(1.1); }

        .avatar-wrapper { position: relative; cursor: pointer; display: inline-block; }
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: url("https://i.imgur.com/uHKPwGT.jpeg") center/cover;
            border: 2px solid rgba(255,255,255,0.2);
            box-shadow: 0 0 25px #7c3aed, 0 0 50px #4f46e5;
            opacity: 0;
            animation: fadeInUp 0.6s 0.2s forwards;
            transition: transform 0.3s;
            position: relative;
            z-index: 1;
        }
        .avatar-wrapper:hover .avatar { transform: scale(1.05); }
        .avatar-wrapper::after {
            content: '';
            position: absolute;
            top: -4px; left: -4px; right: -4px; bottom: -4px;
            border-radius: 50%;
            background: linear-gradient(45deg, #7c3aed, #a78bfa, #f59e0b, #7c3aed);
            background-size: 300% 300%;
            z-index: 0;
            animation: rotateBorder 4s linear infinite;
            opacity: 0.7;
            -webkit-mask: radial-gradient(transparent 58%, black 60%);
        }
        .floating-emoji {
            position: absolute;
            pointer-events: none;
            animation: floatEmoji 1s forwards;
            font-size: 18px;
            z-index: 2;
        }
        .name {
            margin-top: 12px;
            font-size: 26px;
            font-weight: 600;
            opacity: 0;
            animation: fadeInUp 0.6s 0.35s forwards;
            transition: text-shadow 0.3s, color 0.5s ease;
        }
        .name:hover { text-shadow: 0 0 15px rgba(124, 58, 237, 0.8); }
        .bio {
            margin-top: 4px;
            font-size: 13px;
            color: #b0b4c4;
            opacity: 0;
            animation: fadeInUp 0.6s 0.38s forwards;
            line-height: 1.4;
            min-height: 18px;
            transition: color 0.5s ease;
        }
        .status-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 6px;
            font-size: 13px;
            color: #f59e0b;
            opacity: 0;
            animation: fadeInUp 0.6s 0.45s forwards;
            flex-wrap: wrap;
            justify-content: center;
            transition: color 0.5s ease;
        }
        .online-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: #f59e0b;
            box-shadow: 0 0 8px #f59e0b;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.15); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
        .battery, .wifi-icon {
            display: flex; align-items: center; gap: 3px;
            font-size: 11px; color: #8b8fa6;
            transition: color 0.5s ease;
        }
        .battery-icon {
            width: 20px; height: 10px;
            border: 1px solid #8b8fa6;
            border-radius: 2px; position: relative;
            transition: border-color 0.5s ease;
        }
        .battery-fill {
            position: absolute; left: 1px; top: 1px; bottom: 1px;
            background: #22c55e; border-radius: 1px;
        }
        .age-badge {
            background: rgba(124, 58, 237, 0.2);
            padding: 2px 8px; border-radius: 10px;
            font-size: 11px; color: #c4b5fd;
            transition: background 0.5s ease, color 0.5s ease;
        }
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px; margin-top: 24px; width: 100%;
            opacity: 0;
            animation: fadeInUp 0.6s 0.55s forwards;
        }
        .info-tile {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px; padding: 14px 6px;
            text-decoration: none; color: inherit;
            transition: all 0.25s ease;
            display: flex; flex-direction: column;
            align-items: center; gap: 6px;
            font-size: 13px; backdrop-filter: blur(8px);
            cursor: pointer;
            position: relative;
        }
        .info-tile:hover {
            background: rgba(124, 58, 237, 0.15);
            border-color: rgba(124, 58, 237, 0.35);
            transform: translateY(-2px);
        }
        .info-tile[data-tooltip]:hover::before {
            content: attr(data-tooltip);
            position: absolute;
            bottom: -28px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 10px;
            white-space: nowrap;
            z-index: 5;
            pointer-events: none;
        }
        .tile-label { font-size: 10px; color: #8b8fa6; text-transform: uppercase; transition: color 0.5s ease; }
        .tile-value { font-weight: 500; color: #e2e8f0; font-size: 14px; transition: color 0.5s ease; }
        .tags {
            display: flex; flex-wrap: wrap; gap: 6px;
            margin-top: 14px; justify-content: center;
            opacity: 0; animation: fadeInUp 0.6s 0.6s forwards;
        }
        .tag {
            background: rgba(124, 58, 237, 0.15);
            border: 1px solid rgba(124, 58, 237, 0.25);
            padding: 4px 10px; border-radius: 12px;
            font-size: 11px; color: #c4b5fd;
            transition: all 0.2s, background 0.5s ease, color 0.5s ease;
            cursor: default;
        }
        .tag:hover {
            background: rgba(124, 58, 237, 0.3);
            transform: scale(1.05);
            box-shadow: 0 0 12px rgba(124, 58, 237, 0.5);
        }

        /* БЛОК ГОР (исправлено позиционирование) */
        .mountains-block {
            width: 100%;
            height: 50px; /* уменьшено, чтобы не касаться тегов */
            margin-top: 12px;
            margin-bottom: 6px;
            opacity: 0;
            animation: fadeInUp 0.6s 0.63s forwards;
            position: relative;
            overflow: hidden;
            border-radius: 14px;
            background-size: 200% 100%;
            transition: background 0.5s ease;
        }
        .mountains-svg {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: auto;
        }
        .sun-moon {
            position: absolute;
            top: 6px;
            right: 10px;
            font-size: 18px;
            transition: all 0.5s ease;
            filter: drop-shadow(0 0 4px rgba(255,255,255,0.6));
        }

        /* ГАЛЕРЕЯ */
        .gallery {
            display: flex;
            gap: 10px;
            margin-top: 14px;
            opacity: 0;
            animation: fadeInUp 0.6s 0.65s forwards;
        }
        .gallery-item {
            width: 60px;
            height: 60px;
            border-radius: 16px;
            background-size: cover;
            background-position: center;
            border: 2px solid rgba(255,255,255,0.1);
            cursor: pointer;
            transition: all 0.25s;
            position: relative;
            overflow: hidden;
        }
        .gallery-item:hover {
            transform: scale(1.08);
            border-color: #a78bfa;
            box-shadow: 0 0 12px rgba(124,58,237,0.4);
        }
        .gallery-item::after {
            content: "🔍";
            position: absolute;
            bottom: 4px;
            right: 4px;
            font-size: 12px;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .gallery-item:hover::after { opacity: 1; }

        .links-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px; margin-top: 18px; width: 100%;
            opacity: 0; animation: fadeInUp 0.6s 0.68s forwards;
        }
        .link-btn {
            display: flex; flex-direction: column;
            align-items: center; gap: 4px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px; padding: 12px 6px;
            color: #c4b5fd; text-decoration: none;
            transition: all 0.25s, background 0.5s ease, color 0.5s ease;
            backdrop-filter: blur(8px);
            font-size: 12px; font-weight: 500; cursor: pointer;
        }
        .link-btn:hover {
            background: rgba(124, 58, 237, 0.15);
            border-color: rgba(124, 58, 237, 0.35);
            transform: translateY(-2px);
            color: white;
        }
        .link-icon { font-size: 20px; }

        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-30px);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s ease;
            color: white;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.purple { background: rgba(124, 58, 237, 0.9); }
        .toast.green { background: rgba(34, 197, 94, 0.9); }
        .toast.pink { background: rgba(236, 72, 153, 0.9); }
        .toast.blue { background: rgba(59, 130, 246, 0.9); }
        .toast.orange { background: rgba(251, 146, 60, 0.9); }

        .theme-btn, .compact-btn {
            position: fixed;
            right: 20px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(124, 58, 237, 0.4);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.15);
            color: white;
            font-size: 22px;
            cursor: pointer;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s, transform 0.3s, color 0.3s, border-color 0.3s;
        }
        .theme-btn { bottom: 80px; }
        .compact-btn { bottom: 20px; }
        .theme-btn:hover, .compact-btn:hover { background: rgba(124, 58, 237, 0.7); transform: scale(1.1); }

        .music-section {
            margin-top: 18px;
            width: 100%;
            opacity: 0;
            animation: fadeInUp 0.6s 0.75s forwards;
        }
        .music-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(17, 24, 39, 0.45);
            backdrop-filter: blur(12px);
            border-radius: 18px;
            padding: 14px 16px;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.08);
            transition: all 0.3s, background 0.5s ease, border-color 0.5s ease;
        }
        .music-header:hover { background: rgba(124, 58, 237, 0.15); }
        .music-title { font-size: 15px; color: #c4b5fd; font-weight: 500; transition: color 0.5s ease; }
        .arrow { transition: transform 0.3s ease; color: #a78bfa; }
        .music-header.expanded .arrow { transform: rotate(180deg); }
        .music-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.45s ease-in-out;
            background: rgba(17, 24, 39, 0.3);
            border-radius: 0 0 18px 18px;
            margin-top: -2px;
            border: 1px solid rgba(255,255,255,0.04);
            border-top: none;
            transition: background 0.5s ease;
        }
        .music-content.open { max-height: 1000px; }
        .track-list { padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
        .track {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            border-radius: 16px;
            background: rgba(255,255,255,0.02);
            transition: all 0.3s;
            border: 1px solid transparent;
            flex-wrap: wrap;
        }
        .track.playing {
            background: rgba(124, 58, 237, 0.1);
            border-color: rgba(124, 58, 237, 0.3);
            box-shadow: 0 0 15px rgba(124, 58, 237, 0.1);
        }
        .track-num { width: 20px; font-size: 12px; color: #7f8ea3; }
        .track-info { flex: 1; text-align: left; overflow: hidden; }
        .track-title {
            font-size: 14px;
            font-weight: 500;
            color: #e2e8f0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color 0.5s ease;
        }
        .track-artist { font-size: 11px; color: #9ca3af; margin-top: 2px; transition: color 0.5s ease; }
        .track-controls { display: flex; gap: 6px; }
        .t-btn {
            padding: 6px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            font-family: inherit;
        }
        .btn-play { background: #7c3aed; color: white; min-width: 65px; }
        .btn-play:hover { background: #8b5cf6; transform: scale(1.05); }
        .btn-link { background: rgba(255,255,255,0.08); color: #c4b5fd; }
        .btn-link:hover { background: rgba(255,255,255,0.15); color: white; }
        .time-display { font-size: 10px; color: #9ca3af; margin-left: 6px; white-space: nowrap; transition: color 0.5s ease; }
        .progress-bar {
            width: 100%;
            height: 3px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            margin-top: 6px;
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .progress-bar.active { opacity: 1; }
        .progress-fill {
            width: 0%;
            height: 100%;
            background: #a78bfa;
            border-radius: 2px;
            transition: width 0.1s linear;
        }
        .eq-bars {
            display: flex;
            gap: 2px;
            align-items: flex-end;
            height: 14px;
            margin-left: 4px;
        }
        .eq-bar {
            width: 3px;
            background: #a78bfa;
            border-radius: 1px;
            animation: eq 0.8s ease-in-out infinite;
        }
        @keyframes eq {
            0%, 100% { height: 30%; }
            50% { height: 100%; }
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            width: 100%;
            flex-wrap: wrap;
            opacity: 0;
            animation: fadeInUp 0.6s 0.85s forwards;
        }
        .btn {
            flex: 1;
            padding: 14px;
            border-radius: 16px;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.25s;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            background: transparent;
        }
        .btn-write {
            background: rgba(99, 102, 241, 0.3);
            animation: breathe 3s infinite;
        }
        .btn-write:hover { background: rgba(99, 102, 241, 0.5); transform: translateY(-2px); }
        .btn-share { background: rgba(255,255,255,0.05); color: #c4b5fd; }
        .btn-share:hover { background: rgba(255,255,255,0.12); color: white; transform: translateY(-2px); }
        .btn-greet { background: rgba(251, 146, 60, 0.2); color: #fdba74; }
        .btn-greet:hover { background: rgba(251, 146, 60, 0.4); transform: translateY(-2px); }

        .easter-egg {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 60px;
            z-index: 999;
            pointer-events: none;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .easter-egg.show { transform: translate(-50%, -50%) scale(1); }
        .stats-row {
            display: flex; gap: 12px; margin-top: 10px;
            font-size: 11px; color: #8b8fa6;
            opacity: 0; animation: fadeInUp 0.6s 0.68s forwards;
            justify-content: center;
            transition: color 0.5s ease;
        }
    </style>
</head>
<body>
    <div id="toast" class="toast purple"></div>
    <div id="easterEgg" class="easter-egg">🕊️</div>
    <button id="themeBtn" class="theme-btn">🎨</button>
    <button id="compactBtn" class="compact-btn">📦</button>
    <button id="scrollTopBtn" class="scroll-top-btn">⬆</button>
    <audio id="audioPlayer"></audio>
    <canvas id="bg"></canvas>

    <div class="container">
        <div class="profile-card" id="profileCard">
            <div class="avatar-wrapper" id="avatarWrapper">
                <div class="avatar"></div>
            </div>
            <div class="name">Курьер Aidol #Rmpg</div>
            <div class="bio" id="bioText"></div>
            <div class="status-row">
                <span class="online-dot"></span> Возможно в сети
                <span id="clockDisplay" style="color:#8b8fa6;font-size:11px;">00:00</span>
                <span class="age-badge" id="ageBadge">14 лет</span>
                <span class="wifi-icon" title="Wi-Fi">📶</span>
                <span class="battery" id="batteryDisplay">
                    <span class="battery-icon"><span class="battery-fill" id="batteryFill" style="width:80%;"></span></span>
                    <span id="batteryPercent">80%</span>
                </span>
            </div>

            <div class="tags">
                <span class="tag">🏔️ Горы</span>
                <span class="tag">💻 Код</span>
                <span class="tag">📷 Фото</span>
                <span class="tag">🌙 Ночь</span>
            </div>

            <!-- ЖИВОЙ БЛОК ГОР (исправлен) -->
            <div class="mountains-block" id="mountainsBlock">
                <svg class="mountains-svg" viewBox="0 0 400 80" preserveAspectRatio="none">
                    <polygon points="0,80 0,40 50,20 100,45 150,10 200,35 250,15 300,30 350,5 400,25 400,80" fill="rgba(124,58,237,0.3)"/>
                    <polygon points="0,80 0,55 70,30 120,50 180,20 240,45 300,25 360,15 400,35 400,80" fill="rgba(79,70,229,0.25)"/>
                </svg>
                <span class="sun-moon" id="sunMoon">🌙</span>
            </div>

            <!-- МИНИ-ГАЛЕРЕЯ -->
            <div class="gallery">
                <div class="gallery-item" style="background-image: url('gallery1.jpg');" onclick="showToast('Утренние горы', 'purple')"></div>
                <div class="gallery-item" style="background-image: url('gallery2.jpg');" onclick="showToast('Утренние горы', 'purple')"></div>
                <div class="gallery-item" style="background-image: url('gallery3.jpg');" onclick="showToast('Утренние горы', 'purple')"></div>
            </div>

            <div class="info-grid">
                <div class="info-tile" data-tooltip="Нажми, чтобы скопировать" onclick="copyText('@FsbAidol')">
                    <span class="tile-label">ЮЗЕРНЕЙМ</span>

    <script>
        (function() {
            var canvas = document.getElementById("bg");
            var ctx = canvas.getContext("2d");
            function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
            resize(); window.addEventListener('resize', resize);

            var mouse = { x: -1000, y: -1000 };
            document.addEventListener('mousemove', function(e) { mouse.x = e.clientX; mouse.y = e.clientY; });

            var particles = [];
            for (var i = 0; i < 100; i++) {
                particles.push({
                    x: Math.random() * canvas.width, y: Math.random() * canvas.height,
                    dx: (Math.random() - 0.5) * 2.2, dy: (Math.random() - 0.5) * 2.2,
                    r: Math.random() * 1.8 + 0.8,
                    twinkle: Math.random() * Math.PI * 2
                });
            }

            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                var time = Date.now() * 0.001;
                for (var a = 0; a < particles.length; a++) {
                    for (var b = a + 1; b < particles.length; b++) {
                        var dx = particles[a].x - particles[b].x;
                        var dy = particles[a].y - particles[b].y;
                        var dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < 80) {
                            ctx.beginPath(); ctx.moveTo(particles[a].x, particles[a].y);
                            ctx.lineTo(particles[b].x, particles[b].y);
                            ctx.strokeStyle = "rgba(255,255,255," + (0.1 - dist/900) + ")";
                            ctx.lineWidth = 0.4; ctx.stroke();
                        }
                    }
                }
                particles.forEach(function(p) {
                    var dx = mouse.x - p.x;
                    var dy = mouse.y - p.y;
                    var distToMouse = Math.sqrt(dx * dx + dy * dy);
                    if (distToMouse < 100) { p.x -= dx * 0.008; p.y -= dy * 0.008; }
                    p.x += p.dx; p.y += p.dy;
                    if (p.x < 0 || p.x > canvas.width) p.dx *= -1;
                    if (p.y < 0 || p.y > canvas.height) p.dy *= -1;
                    var alpha = 0.5 + 0.5 * Math.sin(time * 3 + p.twinkle);
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fillStyle = "rgba(255,255,255," + alpha + ")";
                    ctx.fill();
                });
                requestAnimationFrame(draw);
            }
            draw();

            var profileCard = document.getElementById('profileCard');
            document.addEventListener('mousemove', function(e) {
                var x = (e.clientX / window.innerWidth - 0.5) * 8;
                var y = (e.clientY / window.innerHeight - 0.5) * 8;
                profileCard.style.transform = 'perspective(800px) rotateY(' + x + 'deg) rotateX(' + (-y) + 'deg) scale(1)';
            });

            // Живое небо в горах
            function updateSky() {
                var hour = new Date().getHours();
                var block = document.getElementById('mountainsBlock');
                var icon = document.getElementById('sunMoon');
                if (hour >= 6 && hour < 10) {
                    block.style.background = 'linear-gradient(180deg, #ff9a9e 0%, #fecfef 100%)';
                    icon.textContent = '🌅';
                } else if (hour >= 10 && hour < 17) {
                    block.style.background = 'linear-gradient(180deg, #4facfe 0%, #00f2fe 100%)';
                    icon.textContent = '☀️';
                } else if (hour >= 17 && hour < 20) {
                    block.style.background = 'linear-gradient(180deg, #fa8231 0%, #f7b731 100%)';
                    icon.textContent = '🌇';
                } else if (hour >= 20 || hour < 5) {
                    block.style.background = 'linear-gradient(180deg, #0f0c29 0%, #302b63 50%, #24243e 100%)';
                    icon.textContent = '🌙';
                } else {
                    block.style.background = 'linear-gradient(180deg, #2c3e50 0%, #3498db 100%)';
                    icon.textContent = '🌙';
                }
            }
            updateSky();
            setInterval(updateSky, 60000);

            // Скролл
            var scrollTopBtn = document.getElementById('scrollTopBtn');
            window.addEventListener('scroll', function() {
                if (window.scrollY > 300) scrollTopBtn.classList.add('visible');
                else scrollTopBtn.classList.remove('visible');
            });
            scrollTopBtn.addEventListener('click', function() { window.scrollTo({ top: 0, behavior: 'smooth' }); });

            // Темы с автонастройкой кнопок
            var themes = [
                { bg: '#05070d', card: 'rgba(15, 18, 30, 0.55)', name: 'Midnight', light: false },
                { bg: '#0d0510', card: 'rgba(30, 15, 35, 0.55)', name: 'Void', light: false },
                { bg: '#100a05', card: 'rgba(35, 20, 15, 0.55)', name: 'Sunset', light: false },
                { bg: '#050d0a', card: 'rgba(15, 30, 25, 0.55)', name: 'Forest', light: false },
                { bg: '#1a0a1a', card: 'rgba(40, 20, 40, 0.55)', name: 'Sakura', light: false },
                { bg: '#0a0a1a', card: 'rgba(20, 20, 40, 0.55)', name: 'Ocean', light: false },
                { bg: '#1a1a0a', card: 'rgba(40, 40, 20, 0.55)', name: 'Desert', light: false },
                { bg: '#0a1a1a', card: 'rgba(20, 40, 40, 0.55)', name: 'Arctic', light: false },
                { bg: '#1a0a0a', card: 'rgba(40, 20, 20, 0.55)', name: 'Candy', light: false },
                { bg: '#0a0a0a', card: 'rgba(20, 20, 20, 0.55)', name: 'Obsidian', light: false },
                { bg: '#f5f5f7', card: 'rgba(255, 255, 255, 0.7)', name: 'Light', light: true }
            ];
            var themeIndex = parseInt(localStorage.getItem('themeIndex')) || 0;
            var themeBtn = document.getElementById('themeBtn');
            var compactBtn = document.getElementById('compactBtn');

            function applyTheme() {
                var t = themes[themeIndex];
                document.body.style.background = t.bg;
                profileCard.style.background = t.card;
                // Меняем цвет текста в зависимости от светлой/тёмной темы
                if (t.light) {
                    document.body.style.color = '#1a1a1a';
                    profileCard.style.color = '#1a1a1a';
                    themeBtn.style.background = 'rgba(0,0,0,0.2)';
                    themeBtn.style.color = '#1a1a1a';
                    compactBtn.style.background = 'rgba(0,0,0,0.2)';
                    compactBtn.style.color = '#1a1a1a';
                    scrollTopBtn.style.background = 'rgba(0,0,0,0.2)';
                    scrollTopBtn.style.color = '#1a1a1a';
                } else {
                    document.body.style.color = 'white';
                    profileCard.style.color = 'white';
                    themeBtn.style.background = 'rgba(124, 58, 237, 0.4)';
                    themeBtn.style.color = 'white';
                    compactBtn.style.background = 'rgba(124, 58, 237, 0.4)';
                    compactBtn.style.color = 'white';
                    scrollTopBtn.style.background = 'rgba(124, 58, 237, 0.4)';
                    scrollTopBtn.style.color = 'white';
                }
            }
            applyTheme();
            themeBtn.addEventListener('click', function() {
                themeIndex = (themeIndex + 1) % themes.length;
                localStorage.setItem('themeIndex', themeIndex);
                applyTheme();
                showToast('Тема: ' + themes[themeIndex].name + ' (' + (themeIndex+1) + '/' + themes.length + ')', 'green');
            });

            // Компактный режим
            if (localStorage.getItem('compact') === '1') profileCard.classList.add('compact');
            compactBtn.addEventListener('click', function() {
                profileCard.classList.toggle('compact');
                var isCompact = profileCard.classList.contains('compact') ? '1' : '0';
                localStorage.setItem('compact', isCompact);
                showToast(isCompact === '1' ? 'Компактный режим' : 'Обычный режим', 'blue');
            });

            // Пасхалка
            var konamiCode = [];
            document.addEventListener('keydown', function(e) {
                konamiCode.push(e.keyCode);
                if (konamiCode.length > 4) konamiCode.shift();
                if (konamiCode.join(',') === '38,38,40,40') {
                    var egg = document.getElementById('easterEgg');
                    egg.classList.add('show');
                    setTimeout(function() { egg.classList.remove('show'); }, 2000);
                    showToast('🕊️ Пасхалка найдена!', 'pink');
                }
            });

            // Уведомления
            window.showToast = function(msg, color) {
                var toast = document.getElementById('toast');
                toast.textContent = msg;
                toast.className = 'toast ' + (color || 'purple') + ' show';
                clearTimeout(toast._timeout);
                toast._timeout = setTimeout(function() { toast.classList.remove('show'); }, 2000);
            };

            window.copyText = function(text) {
                navigator.clipboard.writeText(text).then(function() { showToast('📋 Скопировано: ' + text, 'blue'); });
            };
            window.shareProfile = function() {
                navigator.clipboard.writeText(window.location.href).then(function() { showToast('🔗 Ссылка скопирована!', 'green'); });
            };

            // Часы
            function updateClock() {
                document.getElementById('clockDisplay').textContent = new Date().toLocaleTimeString('ru-RU', { hour:'2-digit', minute:'2-digit' });
            }
            updateClock(); setInterval(updateClock, 10000);

            // Возраст
            function updateAge() {
                var diff = Date.now() - new Date(2011, 11, 19);
                var y = Math.floor(diff / (365.25*24*60*60*1000));
                var m = Math.floor((diff % (365.25*24*60*60*1000)) / (30.44*24*60*60*1000));
                document.getElementById('ageBadge').textContent = y + ' л ' + m + ' мес';
            }
            updateAge();

            // Батарея
            if ('getBattery' in navigator) {
                navigator.getBattery().then(function(b) {
                    function upd() {
                        var p = Math.round(b.level*100);
                        document.getElementById('batteryFill').style.width = p+'%';
                        document.getElementById('batteryPercent').textContent = p+'%';
                    }
                    upd(); b.addEventListener('levelchange', upd);
                });
            }

            // Печатная машинка
            var bioText = '🕊️ 14 лет • код, люблю фотографировать горы';
            var bioEl = document.getElementById('bioText'), bioIdx = 0;
            function type() { if (bioIdx < bioText.length) { bioEl.textContent += bioText[bioIdx]; bioIdx++; setTimeout(type, 40); } }
            setTimeout(type, 800);

            // Сессия
            var sessionStart = Date.now();
            function updSession() {
                var e = Math.floor((Date.now()-sessionStart)/1000);
                document.getElementById('sessionTimer').textContent = '🕐 ' + Math.floor(e/60) + 'м ' + (e%60) + 'с';
            }
            setInterval(updSession, 1000); updSession();

            // Приветствия
            var greetings = ['Привет! 👋','Хай! ✌️','Здарова! 🤙','Ку! 🖖','Hello! 🌍','Bonjour! 🥐','Hola! 🌮'];
            document.getElementById('greetBtn').addEventListener('click', function() {
                showToast(greetings[Math.floor(Math.random()*greetings.length)], 'purple');
            });

            // Аватар
            var emojis = ['❤️','🔥','💜','✨','🕊️','🌟'];
            document.getElementById('avatarWrapper').addEventListener('click', function() {
                for (var i=0;i<5;i++) {
                    var s = document.createElement('span'); s.className='floating-emoji';
                    s.textContent=emojis[Math.floor(Math.random()*emojis.length)];
                    s.style.left=(Math.random()*60-10)+'px'; s.style.top=(Math.random()*40)+'px';
                    this.appendChild(s); setTimeout(function(){s.remove();},1000);
                }
                showToast('Аватарка кликнута!','pink');
            });

            // Треки
            var tracksData = [
                {id:'1',title:'Ash on My Saddle',artist:'Dead Bone Music',yt:'https://www.youtube.com/watch?v=jeiOWmc2Trw'},
                {id:'2',title:'31-я весна',artist:'Ночные Снайперы',yt:'https://www.youtube.com/watch?v=OKORZwSEMNE'},
                {id:'3',title:'Finale',artist:'Toby Fox',yt:'https://www.youtube.com/watch?v=5qajT8lS2ok'},
                {id:'4',title:'Whiskey, Lead & Revenge',artist:'Dark Country',yt:'https://www.youtube.com/watch?v=cg3rT28ia4E'},
                {id:'5',title:'Mary On A Cross (slowed + reverb)',artist:'Ghost',yt:'https://www.youtube.com/watch?v=us9plufTqks'},
                {id:'6',title:'Силуэт',artist:'Ваня Дмитриенко & Аня Пересильд',yt:'https://www.youtube.com/watch?v=DRYzImN_bDM'}
            ];
            var tl = document.getElementById('trackList');
            tracksData.forEach(function(t,i){
                var d=document.createElement('div'); d.className='track'; d.setAttribute('data-id',t.id);
                d.innerHTML='<span class="track-num">'+String(i+1).padStart(2,'0')+'</span><div class="track-info"><div class="track-title"><span class="title-text">'+t.title+'</span><div class="eq-bars" style="display:none"><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div></div><span class="time-display">0:00 / -:--</span></div><div class="track-artist">'+t.artist+'</div><div class="progress-bar"><div class="progress-fill"></div></div></div><div class="track-controls"><button class="t-btn btn-play">Слушать</button><button class="t-btn btn-link" data-url="'+t.yt+'">🔗</button></div>';
                tl.appendChild(d);
            });

            var audio=document.getElementById('audioPlayer'), currentTrackId=null, progressInterval=null;
            function formatTime(s){if(isNaN(s))return'-:--';var m=Math.floor(s/60),sec=Math.floor(s%60);return m+':'+String(sec).padStart(2,'0');}
            function clearPrev(){
                if(currentTrackId){
                    var p=document.querySelector('.track[data-id="'+currentTrackId+'"]');
                    if(p){p.classList.remove('playing');var b=p.querySelector('.btn-play');if(b)b.textContent='Слушать';var e=p.querySelector('.eq-bars');if(e)e.style.display='none';var pb=p.querySelector('.progress-bar');if(pb)pb.classList.remove('active');var td=p.querySelector('.time-display');if(td)td.textContent='0:00 / -:--';}
                }
            }
            function updProgress(){
                if(!currentTrackId)return;
                var t=document.querySelector('.track[data-id="'+currentTrackId+'"]');
                if(!t)return;var f=t.querySelector('.progress-fill'),td=t.querySelector('.time-display');
                if(f&&td&&audio.duration){f.style.width=(audio.currentTime/audio.duration*100)+'%';td.textContent=formatTime(audio.currentTime)+' / '+formatTime(audio.duration);}
            }
            document.querySelectorAll('.track').forEach(function(t){
                var pb=t.querySelector('.btn-play'),lb=t.querySelector('.btn-link'),tid=t.getAttribute('data-id'),eq=t.querySelector('.eq-bars'),pbar=t.querySelector('.progress-bar');
                pb.addEventListener('click',function(){
                    var url='track'+tid+'.mp3';
                    if(currentTrackId===tid){
                        if(audio.paused){audio.play();this.textContent='Пауза';t.classList.add('playing');if(eq)eq.style.display='flex';if(pbar)pbar.classList.add('active');}
                        else{audio.pause();this.textContent='Слушать';t.classList.remove('playing');if(eq)eq.style.display='none';}
                    }else{
                        clearPrev();audio.src=url;audio.play();this.textContent='Пауза';t.classList.add('playing');if(eq)eq.style.display='flex';if(pbar)pbar.classList.add('active');
                        currentTrackId=tid;if(progressInterval)clearInterval(progressInterval);progressInterval=setInterval(updProgress,200);
                    }
                });
                lb.addEventListener('click',function(){window.open(this.getAttribute('data-url'),'_blank');});
            });
            audio.onended=function(){clearPrev();if(progressInterval)clearInterval(progressInterval);currentTrackId=null;};
            audio.onerror=function(){clearPrev();if(progressInterval)clearInterval(progressInterval);currentTrackId=null;showToast('Ошибка загрузки трека','pink');};
            document.getElementById('musicToggle').addEventListener('click',function(){this.classList.toggle('expanded');document.getElementById('musicContent').classList.toggle('open');});
        })();
    </script>
